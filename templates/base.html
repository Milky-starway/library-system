<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library{% endblock %} · Library System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% if user %}
    <nav class="navbar">
        <div class="nav-brand">📚 Library</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/books">Books</a>
            <a href="/loans">Loans</a>
            <a href="/reading">Reading</a>
            {% if user.is_staff %}
            <a href="/members">Members</a>
            {% endif %}
        </div>
        <div class="nav-user">
            <span>{{ user.name }} <em>({{ user.role.value }})</em></span>
            <a href="/logout" class="btn-link">Log out</a>
        </div>
    </nav>
    {% endif %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
