{% extends "base.html" %}
{% block title %}Log Reading Session{% endblock %}
{% block content %}
<h1>Log a Reading Session</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/reading/new" class="form-card">
    <label>Member</label>
    <select name="member_id" required>
        <option value="" disabled selected>Select a member...</option>
        {% for m in members %}
        <option value="{{ m.id }}">{{ m.name }} ({{ m.username }})</option>
        {% endfor %}
    </select>
    <label>Book</label>
    <select name="book_id" required>
        <option value="" disabled selected>Select a book...</option>
        {% for b in books %}
        <option value="{{ b.id }}">{{ b.title }} — {{ b.author }}</option>
        {% endfor %}
    </select>
    <label>Hours spent reading</label>
    <input type="number" step="0.1" min="0.1" name="hours" required>
    <label class="checkbox-label">
        <input type="checkbox" name="finished" value="yes">
        They finished this book today
    </label>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Log session</button>
        <a href="/reading" class="btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
