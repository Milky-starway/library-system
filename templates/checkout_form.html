{% extends "base.html" %}
{% block title %}Check Out a Book{% endblock %}
{% block content %}
<h1>Check Out a Book</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/loans/checkout" class="form-card">
    <label>Book</label>
    <select name="book_id" required>
        <option value="" disabled selected>Select a book...</option>
        {% for b in books %}
        <option value="{{ b.id }}">{{ b.title }} — {{ b.author }} ({{ b.available_copies }} available)</option>
        {% endfor %}
    </select>
    <label>Member</label>
    <select name="member_id" required>
        <option value="" disabled selected>Select a member...</option>
        {% for m in members %}
        <option value="{{ m.id }}">{{ m.name }} ({{ m.email }})</option>
        {% endfor %}
    </select>
    <p class="muted">Due in 14 days from today.</p>
    <div class="form-actions">
        <button type="submit" class="btn-primary">Check out</button>
        <a href="/loans" class="btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
