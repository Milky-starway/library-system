{% extends "base.html" %}
{% block title %}{{ "Edit" if book else "Add" }} Book{% endblock %}
{% block content %}
<h1>{{ "Edit" if book else "Add" }} Book</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ '/books/' + book.id|string + '/edit' if book else '/books/new' }}" class="form-card">
    <label>Title</label>
    <input type="text" name="title" value="{{ book.title if book else '' }}" required autofocus>
    <label>Author</label>
    <input type="text" name="author" value="{{ book.author if book else '' }}" required>
    <label>ISBN</label>
    <input type="text" name="isbn" value="{{ book.isbn if book else '' }}">
    <label>Category</label>
    <input type="text" name="category" value="{{ book.category if book else '' }}">
    <label>Total copies</label>
    <input type="number" name="total_copies" min="1" value="{{ book.total_copies if book else 1 }}" required>
    <div class="form-actions">
        <button type="submit" class="btn-primary">{{ "Save changes" if book else "Add book" }}</button>
        <a href="/books" class="btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
